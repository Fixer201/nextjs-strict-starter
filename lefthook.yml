pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo 'Gitleaks is required: https://github.com/gitleaks/gitleaks#installing'
          exit 1
        fi
        gitleaks protect --staged --verbose
    lint-staged:
      run: bunx --bun lint-staged
pre-push:
  parallel: false
  commands:
    verify:
      run: bun run verify
post-merge:
  commands:
    install:
      glob: 'bun.lock'
      run: bun install --frozen-lockfile
post-checkout:
  commands:
    install:
      glob: 'bun.lock'
      files: 'git diff-tree -r --name-only --no-commit-id ORIG_HEAD HEAD 2>/dev/null || git show --name-only --pretty=format: HEAD'
      run: bun install --frozen-lockfile
