name: Prisma migration check

on:
  pull_request:
    branches: [main]
    paths:
      - 'bun.lock'
      - 'package.json'
      - 'prisma.config.ts'
      - 'prisma/**'
      - 'src/lib/db.ts'
      - 'src/lib/env.ts'
      - 'src/lib/users/**'
      - 'tests/integration/**'
  push:
    branches: [main]
    paths:
      - 'bun.lock'
      - 'package.json'
      - 'prisma.config.ts'
      - 'prisma/**'
      - 'src/lib/db.ts'
      - 'src/lib/env.ts'
      - 'src/lib/users/**'
      - 'tests/integration/**'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: prisma-${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  migrations:
    name: Apply migrations and verify schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: next_template
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d next_template"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/next_template?schema=public
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun ci
      - run: bun run db:generate
      - run: bun run db:validate
      - run: bun run db:migrate:deploy
      - run: bun run db:migrate:status
      - run: bun run test:integration
      - name: Verify migration history matches the schema
        run: bun run db:migrate:check
